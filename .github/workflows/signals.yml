name: OANDA book signals

on:
  schedule:
    - cron: "5,35 * * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print messages in the log instead of sending to Telegram"
        default: "false"

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install httpx pandas numpy
      - name: Restore sent-alert history
        uses: actions/cache/restore@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
          restore-keys: sent-
      - name: Scan
        env:
          OANDA_TOKEN: ${{ secrets.OANDA_TOKEN }}
          OANDA_ENV: practice
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: python signals/signal_bot.py
      - name: Save sent-alert history
        if: always()
        uses: actions/cache/save@v4
        with:
          path: sent.json
          key: sent-${{ github.run_id }}
